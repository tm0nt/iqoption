services:
  db:
    image: mysql:8.4
    container_name: trading-spalone-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-avalon}
      MYSQL_USER: ${MYSQL_USER:-avalon}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - trading_spalone_db:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - app_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: trading-spalone-app:latest
    container_name: trading-spalone-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_URL: https://trading.spalone.com
      NEXTAUTH_URL: https://trading.spalone.com
      AUTH_TRUST_HOST: "true"
      MYSQL_HOST: trading-spalone-db
      MYSQL_PORT: "3306"
      DATABASE_URL: mysql://${MYSQL_USER:-avalon}:${MYSQL_PASSWORD}@trading-spalone-db:3306/${MYSQL_DATABASE:-avalon}
      AVALON_WS_URL: ws://engine:3100/echo/websocket
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - trading_spalone_kyc:/app/private/kyc
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - app_internal
      - proxy

  engine:
    build:
      context: .
      dockerfile: Dockerfile
      target: engine
    image: trading-spalone-engine:latest
    container_name: trading-spalone-engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MYSQL_HOST: trading-spalone-db
      MYSQL_PORT: "3306"
      DATABASE_URL: mysql://${MYSQL_USER:-avalon}:${MYSQL_PASSWORD}@trading-spalone-db:3306/${MYSQL_DATABASE:-avalon}
      AVALON_SERVER_PORT: "3100"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_internal
      - proxy

networks:
  app_internal:
  proxy:
    external: true
    name: iqclone_default

volumes:
  trading_spalone_db:
    name: trading-spalone_trading_spalone_db
  trading_spalone_kyc:
